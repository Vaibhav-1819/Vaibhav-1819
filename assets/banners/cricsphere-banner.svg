<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .bg { fill: #09090B; }
      .card { fill: #18181b; stroke: #27272a; stroke-width: 2; rx: 12; }
      .accent { fill: #3B82F6; }
      .text-primary { fill: #F8FAFC; font-family: 'Space Grotesk', sans-serif; }
      .text-secondary { fill: #A1A1AA; font-family: 'Inter', sans-serif; }
      .text-mono { fill: #A1A1AA; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
      .chip { fill: rgba(59, 130, 246, 0.1); stroke: rgba(59, 130, 246, 0.2); stroke-width: 1; rx: 16; }
      .chip-text { fill: #3B82F6; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.5" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <g transform="translate(80, 80)">
    <text x="0" y="50" class="text-primary" font-size="72" font-weight="700">CricSphere</text>
    <text x="0" y="90" class="text-secondary" font-size="24" font-weight="400">AI-powered Cricket Intelligence Platform</text>
    
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="90" height="32" class="chip" />
      <text x="45" y="21" class="chip-text" text-anchor="middle">DuckDB</text>
      
      <rect x="100" y="0" width="120" height="32" class="chip" />
      <text x="160" y="21" class="chip-text" text-anchor="middle">Spring Boot</text>

      <rect x="230" y="0" width="140" height="32" class="chip" />
      <text x="300" y="21" class="chip-text" text-anchor="middle">Machine Learning</text>
    </g>
  </g>

  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="500" height="340" class="card" />
    <line x1="0" y1="60" x2="500" y2="60" stroke="#27272a" stroke-width="2" />
    <circle cx="30" cy="30" r="6" fill="#ef4444" opacity="0.5"/>
    <circle cx="50" cy="30" r="6" fill="#eab308" opacity="0.5"/>
    <circle cx="70" cy="30" r="6" fill="#22c55e" opacity="0.5"/>
    <text x="250" y="35" class="text-secondary" font-size="14" text-anchor="middle">analytics-pipeline.ts</text>
    
    <path d="M 40 280 L 100 240 L 160 250 L 220 180 L 280 190 L 340 120 L 400 140 L 460 80" fill="none" stroke="#3B82F6" stroke-width="4" />
    <path d="M 40 280 L 100 240 L 160 250 L 220 180 L 280 190 L 340 120 L 400 140 L 460 80 L 460 280 L 40 280 Z" fill="url(#glow)" opacity="0.5" />
    
    <circle cx="100" cy="240" r="6" fill="#09090B" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="220" cy="180" r="6" fill="#09090B" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="340" cy="120" r="6" fill="#09090B" stroke="#3B82F6" stroke-width="3"/>
    <circle cx="460" cy="80" r="6" fill="#09090B" stroke="#3B82F6" stroke-width="3"/>

    <line x1="40" y1="130" x2="460" y2="130" stroke="#27272a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="40" y1="180" x2="460" y2="180" stroke="#27272a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="40" y1="230" x2="460" y2="230" stroke="#27272a" stroke-width="1" stroke-dasharray="4,4"/>

    <g transform="translate(40, 310)">
      <text x="0" y="0" class="text-mono">WIN_PROBABILITY</text>
      <text x="140" y="0" class="text-mono" fill="#3B82F6">84.2%</text>
    </g>
  </g>
</svg>
