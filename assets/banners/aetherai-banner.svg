<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .bg { fill: #09090B; }
      .card { fill: #18181b; stroke: #27272a; stroke-width: 2; rx: 12; }
      .accent { fill: #10B981; }
      .text-primary { fill: #F8FAFC; font-family: 'Space Grotesk', sans-serif; }
      .text-secondary { fill: #A1A1AA; font-family: 'Inter', sans-serif; }
      .text-mono { fill: #A1A1AA; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
      .chip { fill: rgba(16, 185, 129, 0.1); stroke: rgba(16, 185, 129, 0.2); stroke-width: 1; rx: 16; }
      .chip-text { fill: #10B981; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.5" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <g transform="translate(80, 80)">
    <text x="0" y="50" class="text-primary" font-size="72" font-weight="700">AetherAI</text>
    <text x="0" y="90" class="text-secondary" font-size="24" font-weight="400">Environmental Intelligence Platform</text>
    
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="100" height="32" class="chip" />
      <text x="50" y="21" class="chip-text" text-anchor="middle">FastAPI</text>
      
      <rect x="110" y="0" width="100" height="32" class="chip" />
      <text x="160" y="21" class="chip-text" text-anchor="middle">XGBoost</text>

      <rect x="220" y="0" width="90" height="32" class="chip" />
      <text x="265" y="21" class="chip-text" text-anchor="middle">Gemini</text>
    </g>
  </g>

  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="500" height="340" class="card" />
    <line x1="0" y1="60" x2="500" y2="60" stroke="#27272a" stroke-width="2" />
    <circle cx="30" cy="30" r="6" fill="#ef4444" opacity="0.5"/>
    <circle cx="50" cy="30" r="6" fill="#eab308" opacity="0.5"/>
    <circle cx="70" cy="30" r="6" fill="#22c55e" opacity="0.5"/>
    <text x="250" y="35" class="text-secondary" font-size="14" text-anchor="middle">forecast-model.py</text>
    
    <circle cx="150" cy="180" r="70" fill="none" stroke="#27272a" stroke-width="10"/>
    <path d="M 150 110 A 70 70 0 0 1 220 180" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
    <text x="150" y="180" class="text-primary" font-size="36" font-weight="700" text-anchor="middle">42</text>
    <text x="150" y="205" class="text-secondary" font-size="14" text-anchor="middle">AQI (Good)</text>

    <g transform="translate(280, 120)">
      <text x="0" y="10" class="text-mono">PM2.5</text>
      <rect x="60" y="0" width="120" height="10" rx="5" fill="#27272a"/>
      <rect x="60" y="0" width="40" height="10" rx="5" fill="#10B981"/>
      
      <text x="0" y="40" class="text-mono">PM10</text>
      <rect x="60" y="30" width="120" height="10" rx="5" fill="#27272a"/>
      <rect x="60" y="30" width="30" height="10" rx="5" fill="#10B981"/>

      <text x="0" y="70" class="text-mono">O3</text>
      <rect x="60" y="60" width="120" height="10" rx="5" fill="#27272a"/>
      <rect x="60" y="60" width="60" height="10" rx="5" fill="#eab308"/>
      
      <text x="0" y="100" class="text-mono">NO2</text>
      <rect x="60" y="90" width="120" height="10" rx="5" fill="#27272a"/>
      <rect x="60" y="90" width="20" height="10" rx="5" fill="#10B981"/>
    </g>
    
    <rect x="40" y="270" width="420" height="40" rx="4" fill="#09090B" stroke="#27272a" stroke-width="1"/>
    <text x="60" y="295" class="text-mono" fill="#10B981">></text>
    <text x="80" y="295" class="text-mono">Predicting local anomalies...</text>
  </g>
</svg>
