<svg width="100%" height="auto" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Electric Cyan Accent Glow -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16202E" stroke-width="0.5" stroke-opacity="0.6"/>
      <circle cx="30" cy="0" r="0.8" fill="#00E5FF" fill-opacity="0.3"/>
    </pattern>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16202E"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#16202E"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="240" rx="8" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="8" fill="url(#grid)"/>
  <rect width="900" height="240" rx="8" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="898" height="238" rx="7" fill="none" stroke="#172233" stroke-width="1.5"/>
  <line x1="40" y1="1" x2="860" y2="1" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal Status Pill -->
  <g transform="translate(48, 38)">
    <rect width="180" height="22" rx="4" fill="#0D1520" stroke="#1A293D" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#00E5FF"/>
    <text x="24" y="15" fill="#00E5FF" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1">SYSTEM // ACTIVE</text>
  </g>

  <!-- Location / Institute Tag -->
  <g transform="translate(680, 38)">
    <text x="170" y="15" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11">IARE HYDERABAD // IT</text>
  </g>

  <!-- Main Name Typography -->
  <g transform="translate(48, 108)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">Ram</text>
    <text x="105" y="-6" fill="#38BDF8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="14" font-weight="500">.dev</text>
  </g>

  <!-- Subtitle & Focus -->
  <g transform="translate(48, 142)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="400">
      Software Development <tspan fill="#00E5FF">•</tspan> Applied AI &amp; Machine Learning <tspan fill="#00E5FF">•</tspan> Workflow Automation
    </text>
  </g>

  <!-- Terminal Command Line Prompt -->
  <g transform="translate(48, 192)">
    <rect width="804" height="28" rx="4" fill="#080C12" stroke="#131C29" stroke-width="1"/>
    <text x="14" y="18" fill="#00E5FF" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="600">$</text>
    <text x="32" y="18" fill="#CBD5E1" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11.5">
      core.focus <tspan fill="#64748B">--explore</tspan> <tspan fill="#00E5FF">["FastAPI", "Next.js", "DuckDB", "Gemini API", "n8n"]</tspan>
    </text>
  </g>
</svg>
