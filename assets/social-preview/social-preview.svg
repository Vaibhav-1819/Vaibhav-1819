<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .bg { fill: #09090B; }
      .text-primary { fill: #F8FAFC; font-family: 'Space Grotesk', sans-serif; }
      .text-secondary { fill: #A1A1AA; font-family: 'Inter', sans-serif; }
      .text-accent { fill: #3B82F6; font-family: 'JetBrains Mono', monospace; font-size: 16px; }
    </style>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#27272a" stroke-width="0.5" stroke-dasharray="4,4"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <g transform="translate(640, 320)" text-anchor="middle">
    <text x="0" y="-40" class="text-accent">&lt; Developer Workspace v3 /&gt;</text>
    <text x="0" y="20" class="text-primary" font-size="72" font-weight="700">Bharathula Venkata Vaibhav Ram</text>
    <text x="0" y="80" class="text-secondary" font-size="24" font-weight="400">Software Engineer | Full Stack | ML</text>
  </g>
</svg>
